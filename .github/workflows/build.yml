name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-check:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Require a new Xray core for a public release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        VERSION=$(python3 -c 'import re; print(re.search(r"versionName = \"([^\"]+)\"", open("android/V2rayNG/app/build.gradle.kts").read()).group(1))')
        [ "$RELEASE_TAG" = "v${VERSION}-lionbox" ]
        CURRENT=$(tr -d '\r\n' < android/.xray-core-version)
        LATEST=$(gh api repos/2dust/AndroidLibXrayLite/releases/latest --jq '.tag_name')
        [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
        PUBLISHED=""
        if [ -n "$RELEASE" ]; then
          PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/contents/android/.xray-core-version?ref=$RELEASE" --jq '.content' 2>/dev/null | base64 --decode | tr -d '\r\n' || true)
        fi
        echo "Tracked core: $CURRENT; latest core: $LATEST; last published core: ${PUBLISHED:-none} (${RELEASE:-no release})"
        if [ "$CURRENT" != "$LATEST" ]; then
          echo "::error::Tracked Xray core $CURRENT is not the latest core ($LATEST). Run the Update Xray Core workflow instead of a release."
          exit 1
        fi
        if [ "$CURRENT" = "$PUBLISHED" ]; then
          echo "::error::Xray core $CURRENT is already published in $RELEASE. Refusing a public release without a new core."
          exit 1
        fi

  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Clone hev-socks5-tunnel
      run: |
        git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/android/libs ${{ github.workspace }}/android/V2rayNG/app

    - name: Read recorded core version
      id: core
      run: |
        set -euo pipefail
        CORE=$(tr -d '\r\n' < .xray-core-version)
        [[ "$CORE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "tag=$CORE" >> "$GITHUB_OUTPUT"

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ steps.core.outputs.tag }}
        fileName: 'libv2ray.aar'
        out-file-path: android/V2rayNG/app/libs/

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '9.8.2'

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      working-directory: ${{ github.workspace }}/android/V2rayNG
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        gradle licenseFdroidReleaseReport
        gradle assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: apk-artifacts
        path: ${{ github.workspace }}/android/V2rayNG/app/build/outputs/apk/*/release/*.apk

  sign-and-release:
    needs: [build, release-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: apk-artifacts
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            newname="$(basename "$apk" | sed 's/^v2rayNG_/LionBox_/')"
            cp "$apk" "release-files/$newname"
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$newname.sig" "release-files/$newname"
          done

          gpg --armor --export "$KEY" > release-files/lionbox-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          draft: false
          prerelease: false
