name: Update Xray Core

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'  # daily at 18:00 UTC

permissions:
  contents: write
  actions: write

jobs:
  update-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check latest AndroidLibXrayLite release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/2dust/AndroidLibXrayLite/releases/latest --jq .tag_name)
          CURRENT=$(cat android/.xray-core-version 2>/dev/null || echo none)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if core is current
        if: steps.latest.outputs.changed != 'true'
        run: echo "Core ${{ steps.latest.outputs.current }} is already the latest release."

      - name: Bump app version and commit
        if: steps.latest.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          git config user.name "LionBox Bot"
          git config user.email "lionbox@users.noreply.github.com"
          echo "$LATEST" > android/.xray-core-version

          OLD_VERSION=$(grep -oP 'versionName = "\K[0-9.]+' android/V2rayNG/app/build.gradle.kts)
          NEW_VERSION=$(awk -F. -v OFS=. '{$3+=1; print}' <<< "$OLD_VERSION")
          sed -i "s/versionName = \"$OLD_VERSION\"/versionName = \"$NEW_VERSION\"/" android/V2rayNG/app/build.gradle.kts

          git add android/.xray-core-version android/V2rayNG/app/build.gradle.kts
          git commit -m "Update Xray core to $LATEST, app version $NEW_VERSION"
          git push origin HEAD:main

      - name: Trigger signed release build
        if: steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION=$(grep -oP 'versionName = "\K[0-9.]+' android/V2rayNG/app/build.gradle.kts)
          gh workflow run build.yml -f release_tag="v${NEW_VERSION}-lionbox"
