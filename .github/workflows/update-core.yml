name: Update Xray Core

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-xray-core
  cancel-in-progress: false

jobs:
  update-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for core update
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/2dust/AndroidLibXrayLite/releases/latest --jq '.tag_name')
          CURRENT=$(tr -d '\r\n' < android/.xray-core-version)
          [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          PUBLISHED=""
          if [ -n "$RELEASE" ]; then
            PUBLISHED=$(gh api "repos/$GITHUB_REPOSITORY/contents/android/.xray-core-version?ref=$RELEASE" --jq '.content' 2>/dev/null | base64 --decode | tr -d '\r\n' || true)
          fi
          echo "Available core: $LATEST; tracked core: $CURRENT; published core: ${PUBLISHED:-none} (${RELEASE:-no release})"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Retrying publication of the already tracked core without another version bump."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No new Xray core; no version bump or signed release."
          fi

      - name: Bump version and record new core
        if: steps.check.outputs.changed == 'true'
        env:
          CORE_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('android/V2rayNG/app/build.gradle.kts')
          text = path.read_text()
          code = int(re.search(r'versionCode = (\d+)', text).group(1)) + 1
          version = re.search(r'versionName = "([^"]+)"', text).group(1)
          parts = version.split('.')
          parts[-1] = str(int(parts[-1]) + 1)
          text = re.sub(r'versionCode = \d+', f'versionCode = {code}', text, count=1)
          text = re.sub(r'versionName = "[^"]+"', f'versionName = "{".".join(parts)}"', text, count=1)
          path.write_text(text)
          Path('android/.xray-core-version').write_text(os.environ['CORE_VERSION'] + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add android/.xray-core-version android/V2rayNG/app/build.gradle.kts
          git commit -m "Update Xray core to $CORE_VERSION"
          git push origin HEAD:main

      - name: Dispatch signed core release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --event workflow_dispatch --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$ACTIVE" != 0 ]; then
            echo "A signed build is already pending; the next core check will retry if needed."
            exit 0
          fi
          VERSION=$(python3 -c 'import re; print(re.search(r"versionName = \"([^\"]+)\"", open("android/V2rayNG/app/build.gradle.kts").read()).group(1))')
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f "release_tag=v${VERSION}-lionbox"
